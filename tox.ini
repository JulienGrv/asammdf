# tox (https://tox.readthedocs.io/) is a tool for running tests
# in multiple virtualenvs. This configuration file will run the
# test suite on all supported python versions. To use it, "pip install tox"
# and then run "tox" from this directory.

[tox]
isolated_build = true

[testenv:{py37,py38,py39,py310}]
; usedevelop is required for C extensions
usedevelop = true
deps =
    -rtest/requirements.txt
    coverage[toml] >= 6.0
commands_pre =
    coverage erase --rcfile=pyproject.toml
commands =
    coverage run --rcfile=pyproject.toml
commands_post =
    coverage report --rcfile=pyproject.toml

[testenv:style]
deps =
    black ~= 22.0
    isort >= 5.0
commands =
    black --config pyproject.toml --check .
    isort --settings-path pyproject.toml --check .

[testenv:quality]
extras =
    decode
    encryption
    export
    symbolic_math
deps =
    mypy >= 0.910
    types-cryptography >= 3.3
    types-python-dateutil >= 2.8
commands_pre =
    ; see https://pandas.pydata.org/docs/dev/development/contributing_codebase.html#testing-type-hints-in-code-using-pandas
    python -c "import pandas; import pathlib; (pathlib.Path(pandas.__path__[0]) / 'py.typed').touch()"
commands =
    -mypy --config-file=pyproject.toml

[testenv:doc]
deps =
    -rdoc/requirements.txt
commands =
    sphinx-build -W -b html doc doc/_build/html

[testenv:exe]
platform =
    mymacos: darwin
    mywindows: win32
deps =
    -rrequirements_exe_build.txt
commands =
    pyinstaller asammdf.spec --noconfirm --clean --onefile

[testenv:exe_ubuntu]
platform =
    mylinux: linux
deps =
    -rrequirements_exe_build.txt
commands =
    sudo apt update
    sudo apt install libegl1
    pyinstaller asammdf.spec --noconfirm --clean --onefile

[gh-actions]
python =
    3.7: py37, style, quality, doc
    3.8: py38
    3.9: py39, exe, exe_ubuntu
    3.10: py310
